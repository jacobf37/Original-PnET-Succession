name: Build Extension, Installer, and Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (patch, minor, major)"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # ADD MYGET SOURCE FOR LANDIS CORE PACKAGE
      - name: Add MyGet package source for LANDIS-II feed
        run: |
          dotnet nuget add source "https://www.myget.org/F/landis-ii-v8/api/v3/index.json" --name "LANDIS-II-V8"

      - name: List NuGet sources (debug)
        run: dotnet nuget list source

      - name: Download LANDIS-II Support Libraries
        run: PowerShell -ExecutionPolicy Bypass -File ./src/lib/support_libs_download.ps1

      - name: Restore project
        run: dotnet restore ./src/PnET-Succession.csproj

      - name: Build extension project
        run: dotnet build ./src/PnET-Succession.csproj --configuration Release --no-restore

      - name: Install Inno Setup
        run: choco install innosetup --yes

      - name: Build Windows Installer
        run: |
          $installer = "./deploy/installer/PnET Succession 6.1.iss"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" $installer

      ###############################
      # VERSION EXTRACTION
      ###############################
      - name: Extract current version
        id: current
        run: |
          $version = "${{ github.ref_name }}"            # e.g., v6.1.1
          $clean   = $version.TrimStart("v")            # -> 6.1.1
          echo "current=$clean" >> $env:GITHUB_OUTPUT

      - name: Collect Installer Filename
        id: namegen
        run: |
          $version = "${{ steps.current.outputs.current }}"
          $file = "LANDIS-II-V8 PnET-Succession $version-setup.exe"
          echo "installer=$file" >> $env:GITHUB_OUTPUT

      ###############################
      # CREATE RELEASE
      ###############################
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: "PnET-Succession v${{ steps.current.outputs.current }}"
          files: |
            deploy/installer/${{ steps.namegen.outputs.installer }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      ###############################
      # UPDATE docs/index.md
      ###############################
      - name: Update Documentation (index.md)
        run: |
          $version     = "${{ steps.current.outputs.current }}"
          $tag         = "${{ github.ref_name }}"
          $installer   = "${{ steps.namegen.outputs.installer }}"
          $repo        = "${{ github.repository }}"
          $url         = "https://github.com/$repo/releases/download/$tag/$installer"

          $indexPath = "./docs/index.md"
          $content = Get-Content $indexPath

          # Update Release Notes line
          $releaseLine = "Latest official release: Version $version — $(Get-Date -Format 'MMMM yyyy')"
          $content = $content -replace "Latest official release: Version .*", $releaseLine

          # Update Download section line
          $downloadLine = "Version $version installer can be downloaded here: $url. To install it on your computer, launch the installer."
          $content = $content -replace "Version .* installer can be downloaded here:.*", $downloadLine

          Set-Content $indexPath $content

      ###############################
      # UPDATE PnET-Succession.txt
      ###############################
      - name: Update Installer Metadata File
        run: |
          $version = "${{ steps.current.outputs.current }}"
          $filePath = "./deploy/installer/PnET-Succession.txt"
          $content = Get-Content $filePath

          $content = $content -replace 'Version\s+"[^"]+"',     "Version      `"$version`""
          $content = $content -replace 'Description\s+"[^"]+"', "Description  `"PnET-Succession Version $version`""

          Set-Content $filePath $content

      - name: Commit updated files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add ./docs/index.md
          git add ./deploy/installer/PnET-Succession.txt
          git commit -m "Update docs and metadata for version ${{ steps.current.outputs.current }}"
          git push

      ###############################
      # VERSION BUMP LOGIC
      ###############################
      - name: Calculate next version
        id: bump
        run: |
          $current = "${{ steps.current.outputs.current }}"
          $major, $minor, $patch = $current.Split(".")

          switch ("${{ github.event.inputs.bump }}") {
            "major" {
              $major = [int]$major + 1
              $minor = 0
              $patch = 0
            }
            "minor" {
              $minor = [int]$minor + 1
              $patch = 0
            }
            "patch" {
              $patch = [int]$patch + 1
            }
          }

          $next = "$major.$minor.$patch"
          echo "nextVersion=$next" >> $env:GITHUB_OUTPUT

      - name: Push next version tag
        run: |
          $next = "${{ steps.bump.outputs.nextVersion }}"
          git tag "v$next"
          git push origin "v$next"
