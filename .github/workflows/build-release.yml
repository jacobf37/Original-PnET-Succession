name: Build Extension, Installer, and Release

permissions:
  contents: write
  actions: write
  id-token: write

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string

  push:
    tags:
      - "v*"

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          # CASE 1: Manual dispatch (workflow_dispatch) OR workflow_call
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -or "${{ github.event_name }}" -eq "workflow_call") {
            echo "v=${{ inputs.version }}" >> $env:GITHUB_OUTPUT
            exit 0
          }
      
          # CASE 2: Tag push
          elseif ("${{ github.ref }}".StartsWith("refs/tags/")) {
            $clean = "${{ github.ref_name }}".TrimStart("v")
            echo "v=$clean" >> $env:GITHUB_OUTPUT
            exit 0
          }
      
          # CASE 3: Invalid source
          else {
            Write-Error "No valid version source available. Event was '${{ github.event_name }}'."
          }

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Add MyGet package source
        run: dotnet nuget add source "https://www.myget.org/F/landis-ii-v8/api/v3/index.json" --name "LANDIS-II-V8"

      - name: Download LANDIS-II Support Libraries
        run: PowerShell -ExecutionPolicy Bypass -File ./src/lib/support_libs_download.ps1

      - name: Restore project
        run: dotnet restore ./src/PnET-Succession.csproj

      - name: Build extension
        run: dotnet build ./src/PnET-Succession.csproj --configuration Release

      - name: Install Inno Setup
        run: choco install innosetup --yes

      - name: Generate dynamic .iss script
        id: issfile
        run: |
          $version = "${{ steps.version.outputs.v }}"
          $template = "./deploy/installer/PnET-Succession-template.iss"
          $outfile  = "./deploy/installer/PnET Succession $version.iss"

          if (-not (Test-Path $template)) {
            Write-Error "Template .iss file not found: $template"
          }

          $content = (Get-Content $template) -replace "\{VERSION\}", $version
          Set-Content $outfile $content

          echo "path=$outfile" >> $env:GITHUB_OUTPUT

      - name: Build installer
        run: |
          $installer = "${{ steps.issfile.outputs.path }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" $installer

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          name: "PnET-Succession v${{ steps.version.outputs.v }}"
          files: |
            deploy/installer/LANDIS-II-V8_PnET-Succession_${{ steps.version.outputs.v }}_setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      - name: Update Documentation
        run: |
          $v   = "${{ steps.version.outputs.v }}"
          $tag = "${{ github.ref_name }}"
          $exe = "LANDIS-II-V8 PnET-Succession $v-setup.exe"
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$exe"

          $indexPath = "./docs/index.md"
          $content = Get-Content $indexPath

          $content = $content -replace "Latest official release: Version .*", "Latest official release: Version $v — $(Get-Date -Format 'MMMM yyyy')"
          $content = $content -replace "Version .* installer can be downloaded here:.*", "Version $v installer can be downloaded here: $url. To install it on your computer, launch the installer."

          Set-Content $indexPath $content

      - name: Update Metadata File
        run: |
          $v       = "${{ steps.version.outputs.v }}"
          $pathTxt = "./deploy/installer/PnET-Succession.txt"
          $content = Get-Content $pathTxt

          $content = $content -replace 'Version\s+"[^"]+"',     "Version      `"$v`""
          $content = $content -replace 'Description\s+"[^"]+"', "Description  `"PnET-Succession Version $v`""

          Set-Content $pathTxt $content

      - name: Commit updates
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add ./docs/index.md
          git add ./deploy/installer/PnET-Succession.txt
          git commit -m "Update docs and metadata for version ${{ steps.version.outputs.v }}"
          git push
